<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aldelis — Despertador</title>
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despertador">
<script>
// Modulo totalmente independiente y personal: manifest propio en landscape,
// sin depender del manifest.json principal de la app.
(function () {
  try {
    var manifest = {
      name: "Aldelis Despertador",
      short_name: "Despertador",
      start_url: "/despertador.html",
      scope: "/",
      display: "standalone",
      background_color: "#1A1A1A",
      theme_color: "#1A1A1A",
      icons: [
        { src: "/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
        { src: "/icon-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    document.head.appendChild(link);
  } catch (e) { /* sin manifest se puede usar igual, solo no se instala */ }
})();
</script>
<style>
:root{
  --bg:#1A1A1A; --panel:#242424; --ink:#F5F5F5; --ink-soft:#9AA0A6;
  --accent:#D41F3A; --ok:#1D9E75; --line:#3A3A3A;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}
#login{ max-width:340px; margin:0 auto; padding:60px 20px; }
#login input{ width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px; }
#login button{ width:100%; padding:12px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; }
#login-error{ color:var(--accent); font-size:13px; margin-top:8px; min-height:16px; }

#sin-acceso{ max-width:380px; margin:80px auto; text-align:center; padding:0 20px; color:var(--ink-soft); }

#app{ height:100%; display:flex; flex-direction:column; align-items:center; padding:14px; text-align:center; overflow:auto; }

/* Muchos moviles no tienen activada la rotacion automatica y
   screen.orientation.lock() solo funciona instalado a pantalla completa,
   asi que forzamos el giro por CSS: si el viewport esta en vertical,
   rotamos toda la pagina 90 grados en vez de depender del sistema. */
body.forzar-rot{
  position:absolute; top:0; left:100%;
  width:100vh; height:100vw;
  transform-origin:0 0; transform:rotate(90deg);
  overflow-x:hidden;
}

/* Reloj retro de cortinillas (split-flap), tipo despertador de mesa de toda
   la vida: ocupa casi toda la pantalla, los controles van en una barra
   pequeña debajo. Los tamaños se calculan con container query units sobre
   .reloj-caja (no con vw/vh) porque el giro forzado por CSS deja los vw/vh
   del viewport referidos al movil en vertical, no a lo que se ve en pantalla. */
#app-contenido{ height:100%; width:100%; max-width:900px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.reloj-caja{
  flex:1 1 auto; min-height:0; width:100%;
  background:linear-gradient(180deg,#2b1f18,#1c1410);
  border:1px solid #3a2c22; border-radius:20px;
  box-shadow:0 16px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1cqh;
  container-type:size;
}
#reloj{ display:flex; align-items:center; gap:2.5cqw; perspective:600px; }
.flip-unit{
  position:relative;
  width:15cqw; height:60cqh;
  font-size:52cqh;
  font-family:'Courier New', Courier, monospace; font-weight:700;
  color:#F3ECDA; background:#1c1c1c; border-radius:.12em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), 0 6px 14px rgba(0,0,0,.5);
  overflow:hidden;
}
.flip-unit::after{ content:''; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(0,0,0,.6); transform:translateY(-1px); z-index:5; }
.fu-half{ position:absolute; left:0; right:0; height:50%; display:flex; justify-content:center; line-height:1; }
.fu-half.top{ top:0; align-items:flex-start; }
.fu-half.bottom{ bottom:0; align-items:flex-end; }
.fu-flap{
  position:absolute; left:0; right:0; top:0; height:50%; overflow:hidden;
  display:flex; align-items:flex-start; justify-content:center;
  background:#242424; border-radius:.12em .12em 0 0;
  transform-origin:bottom center; backface-visibility:hidden;
  box-shadow:0 2px 4px rgba(0,0,0,.4); z-index:6;
}
.fu-flap.falling{ animation:fu-caer .4s cubic-bezier(.5,0,.75,0) forwards; }
@keyframes fu-caer{ 0%{ transform:rotateX(0deg); } 100%{ transform:rotateX(-100deg); } }
.reloj-colon{ display:flex; flex-direction:column; gap:8cqh; padding:0 .3cqw; align-self:center; }
.reloj-colon span{ width:3cqh; height:3cqh; border-radius:50%; background:var(--accent); display:block; animation:fu-parpadeo 2s steps(1) infinite; }
@keyframes fu-parpadeo{ 0%,49%{ opacity:1; } 50%,100%{ opacity:.25; } }
#fecha-hoy{ color:var(--ink-soft); font-size:3.2cqh; text-transform:capitalize; }

.panel-alarma{ background:var(--panel); border-radius:14px; padding:8px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; flex:0 0 auto; }
.panel-alarma input[type=time]{
  font-size:22px; font-weight:700; background:transparent; color:var(--ink);
  border:none; font-variant-numeric:tabular-nums; text-align:center;
}
.chk-repetir{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
.chk-repetir input{ width:16px; height:16px; }

#btn-armar{ padding:9px 22px; border-radius:10px; border:none; font-size:14px; font-weight:700; background:var(--ok); color:#fff; cursor:pointer; }
#btn-armar.armado{ background:var(--accent); }
#estado-alarma{ font-size:11px; color:var(--ink-soft); min-height:14px; flex:0 0 auto; }
#aviso-pantalla{ font-size:10px; color:var(--ink-soft); max-width:520px; flex:0 0 auto; }

#btn-test-sonido{ padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-size:11px; cursor:pointer; flex:0 0 auto; }

.cerrar-sesion{ position:fixed; top:10px; right:14px; font-size:12px; color:var(--ink-soft); text-decoration:none; }
#btn-pantalla-completa{ position:fixed; top:8px; left:14px; font-size:12px; color:var(--ink-soft); background:transparent; border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; }

/* Pantalla de alarma sonando */
#ringing{
  display:none; position:fixed; inset:0; z-index:50; background:var(--accent);
  flex-direction:column; align-items:center; justify-content:center; gap:30px;
  animation:flash 1s ease-in-out infinite;
}
@keyframes flash{ 0%,100%{ background:var(--accent); } 50%{ background:#8f0f22; } }
#ringing-hora{ font-size:clamp(64px, 18vw, 160px); font-weight:800; color:#fff; font-variant-numeric:tabular-nums; }
.ringing-btns{ display:flex; gap:20px; }
.ringing-btns button{ padding:26px 44px; border-radius:20px; border:none; font-size:22px; font-weight:800; cursor:pointer; }
#btn-apagar{ background:#fff; color:var(--accent); }
#btn-posponer{ background:rgba(0,0,0,.35); color:#fff; }

#toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--panel); color:#fff; padding:11px 18px; border-radius:24px; font-size:13.5px; opacity:0; transition:all .25s; z-index:60; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="login" style="display:none">
  <h2 style="text-align:center">Despertador</h2>
  <input type="email" id="login-email" placeholder="Email" autocomplete="username">
  <input type="password" id="login-pass" placeholder="Contrasena" autocomplete="current-password">
  <button id="login-btn">Entrar</button>
  <div id="login-error"></div>
</div>

<div id="sin-acceso" style="display:none">
  <p>Esta funcion es de uso personal y no esta disponible para este usuario.</p>
</div>

<div id="app" style="display:none">
  <a href="#" class="cerrar-sesion" id="cerrar-sesion">Cerrar sesion</a>
  <button id="btn-pantalla-completa">⛶ Pantalla completa</button>

  <div id="app-contenido">
    <div class="reloj-caja">
      <div id="reloj"></div>
      <div id="fecha-hoy"></div>
    </div>

    <div class="panel-alarma">
      <input type="time" id="hora-alarma">
      <label class="chk-repetir"><input type="checkbox" id="chk-repetir" checked> Repetir cada dia</label>
      <button id="btn-armar">Activar</button>
    </div>

    <div id="estado-alarma"></div>
    <button id="btn-test-sonido">Probar sonido y vibracion</button>
    <div id="aviso-pantalla">
      Deja esta pantalla abierta y el movil enchufado o con bateria de sobra:
      el sonido solo suena mientras esta app esta en primer plano con la pantalla encendida.
    </div>
  </div>
</div>

<div id="ringing">
  <div id="ringing-hora"></div>
  <div class="ringing-btns">
    <button id="btn-posponer">Posponer 9 min</button>
    <button id="btn-apagar">Apagar</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config-compat.js"></script>
<script src="js/despertador.js"></script>
</body>
</html>
