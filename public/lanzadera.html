<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Aldelis — Lanzadera</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#D41F3A">
  <link rel="icon" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* FAB de chat fijo en la parte inferior */
    #chat-fab {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 16px;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      z-index: 100;
      transition: background .15s;
    }
    /* Overlay de chat */
    #chat-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      flex-direction: column;
      z-index: 200;
    }
    .chat-ov-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #E5E7EB;
      background: #fff;
    }
    #chat-ov-titulo {
      font-size: 15px;
      font-weight: 600;
      color: #1A1A1A;
    }
    .chat-ov-close {
      background: none;
      border: none;
      font-size: 20px;
      color: #6B7280;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }
    #chat-ov-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-row { display: flex; }
    .chat-row.r { justify-content: flex-end; }
    .chat-row.l { justify-content: flex-start; }
    .chat-b {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
    }
    .chat-b-in  { background: #F3F4F6; color: #1A1A1A; border-bottom-left-radius: 4px; }
    .chat-b-out { background: #D41F3A; color: #fff; border-bottom-right-radius: 4px; }
    .chat-time {
      display: block;
      font-size: 10px;
      margin-top: 3px;
      opacity: 0.6;
    }
    .chat-emisor {
      display: block;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 2px;
      opacity: 0.75;
    }
    .chat-day {
      text-align: center;
      font-size: 11px;
      color: #9CA3AF;
      margin: 8px 0;
    }
    #chat-ov-quick {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      flex-shrink: 0;
      border-top: 1px solid #F0F0F0;
    }
    .chatov-chip {
      background: #F3F4F6;
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      color: #374151;
    }
    .chatov-chip:hover { background: #E5E7EB; }
    .chat-ov-input {
      display: flex;
      gap: 8px;
      padding: 10px 16px 16px;
      border-top: 1px solid #E5E7EB;
      background: #fff;
      flex-shrink: 0;
    }
    #chat-ov-text {
      flex: 1;
      border: 1.5px solid #E0E0E0;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      background: #F9F9F9;
    }
    #chat-ov-text:focus { border-color: #D41F3A; }
    .chat-ov-send {
      background: #D41F3A;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div style="width:100%;max-width:480px">
    <div class="portal-header">
      <div class="logo">Aldelis</div>
      <div class="logo-sub">Registro de lanzadera</div>
    </div>
    <div id="app"></div>
  </div>

  <!-- Chat FAB -->
  <button id="chat-fab" onclick="abrirChat()">Chat con almacen</button>

  <!-- Overlay de chat -->
  <div id="chat-overlay" style="display:none">
    <div class="chat-ov-header">
      <div id="chat-ov-titulo">Chat con Almacen</div>
      <button class="chat-ov-close" onclick="cerrarChat()">&#x2715;</button>
    </div>
    <div id="chat-ov-msgs"></div>
    <div id="chat-ov-quick"></div>
    <div class="chat-ov-input">
      <input type="text" id="chat-ov-text" placeholder="Escribe un mensaje..."
        onkeydown="if(event.key==='Enter')enviarChatLanz()">
      <button class="chat-ov-send" onclick="enviarChatLanz()">Enviar</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script src="js/firebase-config-compat.js"></script>
  <script src="js/push.js"></script>
  <script src="js/lanzadera.js"></script>
</body>
</html>
