<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Aldelis — Técnico Bizerba</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F5F5F5;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 480px;
    }
    .logo { font-size: 26px; font-weight: 600; color: #D41F3A; letter-spacing: -0.5px; }
    .logo-sub { font-size: 13px; color: #6B7280; margin-top: 2px; }
    .tecnico-badge {
      display: inline-block;
      margin-top: 8px;
      background: #1A1A1A;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: .04em;
    }

    .section { width: 100%; max-width: 480px; margin-bottom: 16px; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 8px;
    }

    .inc-linea {
      font-size: 12px;
      font-weight: 600;
      color: #D41F3A;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }
    .inc-averia {
      font-size: 15px;
      font-weight: 600;
      color: #1A1A1A;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .inc-meta {
      font-size: 12px;
      color: #6B7280;
      margin-bottom: 12px;
    }
    .inc-meta strong { color: #374151; }

    .btn-row { display: flex; gap: 8px; }
    .btn-coger {
      flex: 1;
      background: #D41F3A;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-coger:hover { background: #B8172F; }
    .btn-repuesto {
      background: #fff;
      color: #E08A00;
      border: 1.5px solid #E08A00;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-repuesto:hover { background: #FFF8EC; }
    .btn-resuelta {
      flex: 1;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-resuelta:hover { background: #178060; }

    .activa-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border-left: 4px solid #1D9E75;
    }
    .activa-card.repuesto { border-left-color: #E08A00; }
    .timer {
      font-size: 28px;
      font-weight: 700;
      color: #1A1A1A;
      margin: 8px 0 4px;
      letter-spacing: -.5px;
    }
    .timer-label { font-size: 12px; color: #6B7280; margin-bottom: 14px; }

    .empty {
      text-align: center;
      padding: 24px;
      color: #9CA3AF;
      font-size: 14px;
      background: #fff;
      border-radius: 12px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 700; color: #1A1A1A; }
    .stat-lbl { font-size: 11px; color: #9CA3AF; margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

    #error-screen {
      text-align: center;
      padding: 40px 20px;
      max-width: 480px;
    }
    #error-screen .logo { margin-bottom: 16px; }
    #error-screen p { color: #6B7280; font-size: 14px; }
  </style>
</head>
<body>

  <div id="error-screen" style="display:none">
    <div class="logo">Aldelis</div>
    <p>QR no válido. Escanea el código de tu tarjeta de técnico.</p>
  </div>

  <div id="main" style="display:none; width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center">
    <div class="header">
      <div class="logo">Aldelis</div>
      <div class="logo-sub">Panel de técnico</div>
      <div class="tecnico-badge" id="tecnico-label">Técnico —</div>
    </div>

    <!-- Stats del día -->
    <div class="section">
      <div class="section-title">Hoy</div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" id="st-resueltas">0</div><div class="stat-lbl">Resueltas</div></div>
        <div class="stat-card"><div class="stat-val" id="st-tresp">—</div><div class="stat-lbl">T. respuesta</div></div>
        <div class="stat-card"><div class="stat-val" id="st-treso">—</div><div class="stat-lbl">T. resolución</div></div>
      </div>
    </div>

    <!-- Incidencia activa -->
    <div class="section">
      <div class="section-title">Mi incidencia activa</div>
      <div id="activa-cont"></div>
    </div>

    <!-- Pendientes -->
    <div class="section">
      <div class="section-title">Pendientes de coger</div>
      <div id="pendientes-cont"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config-compat.js"></script>
  <script src="js/bizerba.js"></script>
</body>
</html>
